<mat-card class="book-card">
    <mat-card-title>{{ book?.title }}</mat-card-title>
    <mat-card-content>
        <div class="content">
            {{ book?.summary }}
        </div>
        <span>評価: {{ book?.rating }}点</span>
    </mat-card-content>
    <div>
        <button type="button" class="delete" (click)="delete()">消去</button>
    </div>
</mat-card>
